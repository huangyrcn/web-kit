; web-kit server processes, all as user webkit. Logs go to the container's stdout.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/local/bin/start-xvfb.sh
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=/usr/bin/fluxbox
priority=20
autorestart=true
environment=HOME="/home/webkit",DISPLAY=":99"
stdout_logfile=/dev/null
redirect_stderr=true

; The daemon the OpenCLI extension connects to (127.0.0.1:19825, inside the container).
[program:opencli]
command=/opt/node/bin/node /opt/node/lib/node_modules/@jackwener/opencli/dist/src/daemon.js
priority=25
autorestart=true
startsecs=3
environment=HOME="/home/webkit"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chrome]
command=/usr/local/bin/start-chrome.sh
priority=30
autorestart=true
startsecs=5
environment=HOME="/home/webkit",DISPLAY=":99"
stdout_logfile=/dev/null
redirect_stderr=true

[program:serve]
command=/usr/bin/python3 -m webkit.serve --host 0.0.0.0 --port 8082
priority=40
autorestart=true
startsecs=3
environment=HOME="/home/webkit",PYTHONPATH="/opt/webkit/src",DISPLAY=":99"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=/usr/local/bin/start-vnc.sh
priority=50
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:novnc]
command=/usr/local/bin/start-novnc.sh
priority=60
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
