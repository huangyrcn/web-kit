[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:caddy]
command=/usr/local/bin/start-caddy.sh
priority=5
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
command=/usr/local/bin/start-xvfb.sh
priority=10
autorestart=true
startsecs=2
environment=DISPLAY=":99"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=/usr/bin/fluxbox
priority=20
autorestart=true
startsecs=2
environment=DISPLAY=":99"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=/usr/local/bin/start-vnc.sh
priority=30
autorestart=true
startsecs=2
environment=DISPLAY=":99"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6081 localhost:5900
priority=40
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chrome]
command=/usr/local/bin/start-chrome.sh
priority=50
autorestart=true
startsecs=10
startretries=10
environment=DISPLAY=":99"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webkit-api]
command=/opt/webkit/bin/python -m webkit_api.main
directory=/opt/webkit-app
priority=70
autorestart=true
startsecs=5
environment=PYTHONPATH="/opt/webkit-app",HOME="/root"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:searxng]
command=/usr/local/bin/start-searxng.sh
priority=80
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:watchdog]
command=/usr/local/bin/watchdog.sh
priority=90
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
