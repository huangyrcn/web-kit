# web-kit v2 backend.
#
#   cp .env.example .env   # fill in the secrets
#   cp searxng-settings/settings.yml.example searxng-settings/settings.yml
#   docker compose up -d --build
#
# Several instances can share one host (e.g. a test stack next to production):
# give each its own project name (-p), WEBKIT_CONTAINER and ports in its .env.
services:
  web-kit:
    image: ${WEBKIT_IMAGE:-web-kit:v2}
    build:
      context: .
      args:
        IMAGE_TAG: ${WEBKIT_IMAGE:-web-kit:v2}
    container_name: ${WEBKIT_CONTAINER:-web-kit}
    restart: unless-stopped
    shm_size: "1gb"
    mem_limit: ${WEBKIT_MEM_LIMIT:-4g}
    ports:
      # The API port is the only one clients need. noVNC and CDP are admin-only.
      - "${WEBKIT_BIND:-127.0.0.1}:${WEBKIT_API_PORT:-8082}:8082"
      - "${WEBKIT_BIND:-127.0.0.1}:${WEBKIT_VNC_PORT:-6080}:6080"
      - "${WEBKIT_BIND:-127.0.0.1}:${WEBKIT_CDP_PORT:-9223}:9223"
    environment:
      WEBKIT_API_KEY: ${WEBKIT_API_KEY:?set WEBKIT_API_KEY in .env}
      WEBKIT_ADMIN_KEY: ${WEBKIT_ADMIN_KEY:?set WEBKIT_ADMIN_KEY in .env}
      WEBKIT_NOVNC_HASH: ${WEBKIT_NOVNC_HASH:?set WEBKIT_NOVNC_HASH in .env}
      WEBKIT_VNC_PASSWORD: ${WEBKIT_VNC_PASSWORD:-}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      WEBKIT_MAX_PAGES: ${WEBKIT_MAX_PAGES:-5}
    volumes:
      - ./searxng-settings:/etc/searxng:rw
      - chrome-profile:/data/chrome-profile

volumes:
  chrome-profile:
