# web-kit server: Chrome + opencli + webkit-serve + noVNC in one container.
#
#   cp backend/.env.example backend/.env && chmod 600 backend/.env   # fill it in
#   docker compose -f backend/docker-compose.yml up -d --build
#
# Bind the ports to an address only trusted clients reach (e.g. this host's tailnet
# address), never 0.0.0.0 on a shared network: every request still needs a key.
services:
  web-kit:
    image: ${WEBKIT_IMAGE:-web-kit:server}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        IMAGE_TAG: ${WEBKIT_IMAGE:-web-kit:server}
    container_name: ${WEBKIT_CONTAINER:-web-kit}
    restart: unless-stopped
    shm_size: "1gb"
    mem_limit: ${WEBKIT_MEM_LIMIT:-4g}
    ports:
      - "${WEBKIT_BIND:?set WEBKIT_BIND in .env}:${WEBKIT_API_PORT:-8082}:8082"   # the API
      - "${WEBKIT_BIND:?set WEBKIT_BIND in .env}:${WEBKIT_VNC_PORT:-6080}:6080"   # noVNC, for a person
    environment:
      WEBKIT_API_KEY: ${WEBKIT_API_KEY:?set WEBKIT_API_KEY in .env}
      WEBKIT_ADMIN_KEY: ${WEBKIT_ADMIN_KEY:?set WEBKIT_ADMIN_KEY in .env}
      WEBKIT_S2_API_KEY: ${WEBKIT_S2_API_KEY:-}
      WEBKIT_MAX_INFLIGHT: ${WEBKIT_MAX_INFLIGHT:-4}
      WEBKIT_LOG: ${WEBKIT_LOG:-on}
      # Browser time zone: match the egress IP's region (a UTC browser on a
      # California IP is an anti-bot signal).
      TZ: ${WEBKIT_TZ:-UTC}
    volumes:
      - chrome-data:/data/chrome-profile

volumes:
  chrome-data:
