[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "web-kit"
version = "2.0.0.dev0"
description = "CLI for a self-hosted, browser-backed web access service: search, read, crawl, download."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "huangyrcn" }]
dependencies = []  # stdlib only: fast `uv tool install`

[project.scripts]
webkit = "webkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webkit"]

[tool.hatch.build.targets.sdist]
include = ["src/webkit", "README.md", "LICENSE"]
